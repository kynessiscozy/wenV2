<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>问问大师 · 东方人生决策系统</title>

<link rel="stylesheet" href="/src/styles.css">
</head>
<body>

<div class="mesh"></div>
<canvas class="particles" id="tjParticles"></canvas>
<div class="cursor-ring" id="tjCursorRing"></div>
<div class="cursor-dot" id="tjCursorDot"></div>

<div class="ld-ov" id="ldov">
  <div class="ld-sp"></div>
  <div class="ld-t">问问大师推演中</div>
  <div class="ld-br"><div class="ld-bf" id="ldbf"></div></div>
  <div class="ld-st" id="ldst">排列四柱…</div>
</div>

<div class="page" id="page1">
  <div class="p1-scroll">
    <div class="p1-inner">
      <div class="home-card anim-in d1" id="formCard">
        <div class="form-grid">
          <div class="fd"><label>出生日期</label><input type="date" id="bDate" value="1990-06-15"></div>
          <div class="fd"><label>出生时间</label><input type="time" id="bTime" value="09:00" style="font-family:var(--sf)"></div>
          <div class="fd"><label>出生地点</label><div class="cw"><input type="text" id="cInp" placeholder="搜索城市…" autocomplete="off" value="上海"><input type="hidden" id="bPlace" value="shanghai"><div class="cdd" id="cDD"></div></div></div>
          <div class="fd"><label>性别</label><select id="bGen"><option value="male">男（乾造）</option><option value="female">女（坤造）</option></select></div>
          <div class="fd full">
            <label>你现在最想解决什么？</label>
            <div class="chip-wrap" id="qChips">
              <div class="chip" data-q="事业方向" onclick="selChip(this)">事业方向</div>
              <div class="chip" data-q="财运提升" onclick="selChip(this)">财运提升</div>
              <div class="chip" data-q="感情关系" onclick="selChip(this)">感情关系</div>
              <div class="chip" data-q="跳槽创业" onclick="selChip(this)">跳槽创业</div>
              <div class="chip" data-q="健康状态" onclick="selChip(this)">健康状态</div>
              <div class="chip" data-q="人生迷茫" onclick="selChip(this)">人生迷茫</div>
            </div>
            <input type="hidden" id="bQ" value="">
          </div>
        </div>
        <div class="switch-row" style="margin-top:6px"><div class="switch" id="swTrueSolar" onclick="this.classList.toggle('on');document.getElementById('swText').textContent=(this.classList.contains('on')?'开启':'关闭')+'真太阳时（按出生地经度精确换算时辰）'"></div><span id="swText">关闭真太阳时（按出生地经度精确换算时辰）</span></div>
        <div class="cta-row">
          <button class="cta" id="btnGo2" onclick="calc()">开始推演</button>
          <button class="preview-cta" type="button" onclick="calc(true)" aria-label="使用示例信息先查看报告">随便看看</button>
        </div>
      </div>
      <div id="recentZone" style="margin-bottom:24px;display:none">
        <div class="recent-hd">
          <div class="recent-hd-title">最近推演</div>
        </div>
        <div class="recent-grid" id="recentGrid"></div>
      </div>

      <div id="profileZone" style="margin-bottom:24px;display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:.78em;color:rgba(255,245,220,0.35);letter-spacing:1px">命盘档案</div>
          <div style="display:flex;gap:8px">
            <button onclick="exportProfiles()" style="padding:5px 12px;border-radius:100px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.5);font-size:.72em;font-family:var(--sf);cursor:pointer;transition:all .2s" onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.08)'">导出</button>
            <button onclick="document.getElementById('impFile').click()" style="padding:5px 12px;border-radius:100px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.5);font-size:.72em;font-family:var(--sf);cursor:pointer;transition:all .2s" onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.08)'">导入</button>
            <input type="file" id="impFile" style="display:none" accept=".json" onchange="handleImport(this)">
          </div>
        </div>
        <div id="profileGrid" class="recent-grid"></div>
        <div id="profileEmpty" class="pf-empty" style="display:none;color:rgba(255,255,255,0.25);font-size:.78em;text-align:center;padding:14px 0">暂无档案，推算后点击「保存」即可收藏命盘</div>
      </div>

      <div class="anim-in d2" style="text-align:center;padding:20px 0 8px">
        <p style="color:rgba(255,255,255,0.14);font-size:.6em;letter-spacing:4px">问 · 问 · 大 · 师 · 八 · 字 · 决 · 策</p>
      </div>
    </div>
  </div>
</div>

<div class="page hidden" id="page2">
  <div class="p2-top">
    <button class="p2-back" onclick="goBack()">
      <span>重新推演</span>
    </button>
    <div class="mode-top-group" role="tablist" aria-label="报告阅读模式"><button class="mode-top-switch" id="modeBeginner" type="button" role="tab" aria-selected="true" onclick="setUserMode('beginner')">新手</button><button class="mode-top-switch" id="modeMaster" type="button" role="tab" aria-selected="false" onclick="setUserMode('master')">大师</button></div>
    <div class="p2-actions"><div class="p2-act" id="lgFab" onclick="toggleLgPanel()" title="玻璃质感强度">◐</div>
      <div class="p2-act" onclick="openSaveModal()" title="保存档案">💾</div>
    </div>
  </div>
  <div class="p2-scroll" id="p2Scroll"><button class="back-to-top" id="backToTop" onclick="document.getElementById('p2Scroll').scrollTo({top:0,behavior:'smooth'})"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg></button>
    <div class="p2-inner" id="p2Inner"></div>
  </div>
</div>

<!-- iOS Instagram-style Dock Bar -->
<div class="tab-bar" id="tabBar">
  <div class="tab-bar-inner">
    <div class="tab-item active" data-sec="s-ming" onclick="switchTab(this)">
      <div class="tab-icon">
        <svg class="ico-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
        <svg class="ico-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="10"/><rect x="10.5" y="1.5" width="3" height="6" rx="1.5"/><rect x="10.5" y="16.5" width="3" height="6" rx="1.5"/><rect x="1.5" y="10.5" width="6" height="3" rx="1.5"/><rect x="16.5" y="10.5" width="6" height="3" rx="1.5"/></svg>
      </div>
      <span class="tab-label">命盘</span>
    </div>
    <div class="tab-item" data-sec="s-yun" onclick="switchTab(this)">
      <div class="tab-icon">
        <svg class="ico-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <svg class="ico-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M2 12h3.3L9 4l5.5 17L18 12h4v1.5h-3.3L15 20 9.5 3 7 12H2z"/></svg>
      </div>
      <span class="tab-label">运势</span>
    </div>
    <button class="ai-fab" id="aiFab" type="button" onclick="openAsk()" aria-label="打开问问大师" title="问问大师">
      <span class="ai-orbits" aria-hidden="true"></span>
      <span class="ai-fab-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </span>
      <span class="ai-fab-text">问问</span>
      <span class="ai-badge" aria-hidden="true">AI</span>
    </button>
    <div class="tab-item" data-sec="s-rel" onclick="switchTab(this)">
      <div class="tab-icon">
        <svg class="ico-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <svg class="ico-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <span class="tab-label">关系</span>
    </div>
    <div class="tab-item" data-sec="s-adv" onclick="switchTab(this)">
      <div class="tab-icon">
        <svg class="ico-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <svg class="ico-filled" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </div>
      <span class="tab-label">工具</span>
    </div>
  </div>
</div>

<div class="lg-panel" id="lgPanel">
  <div class="lg-panel-tt">玻璃质感强度</div>
  <div class="lg-opts">
    <div class="lg-opt" data-mode="clear" onclick="setGlassMode('clear')">清澈</div>
    <div class="lg-opt active" data-mode="standard" onclick="setGlassMode('standard')">标准</div>
    <div class="lg-opt" data-mode="tinted" onclick="setGlassMode('tinted')">凝重</div>
  </div>
</div>

<div class="ai-overlay" id="aiOverlay" onclick="closeAsk()"></div>
<div class="ai-sheet" id="aiSheet">
  <div class="ai-actions">
    <button class="ai-new" type="button" onclick="newAskChat()" title="新对话" aria-label="新对话">＋</button>
    <button class="ai-settings" type="button" onclick="toggleAISettings()" title="AI 设置" aria-label="AI 设置">⚙</button>
    <button class="ai-close" type="button" onclick="closeAsk()" title="关闭" aria-label="关闭">×</button>
  </div>
  <div class="ai-handle"></div>
  <div class="ai-head">
    <div class="ai-title">问问大师 <span class="ai-subtitle">命盘解读 · 行动建议</span></div>
    <div class="ai-context" id="aiContext"><span>✦ 智能定位</span><b>输入你的问题，获取结合命盘的具体建议</b></div>
    <div class="ai-free-prompt">可以问职业选择、关系困惑、近期计划，或任意命理术语。</div>
  </div>
  <!-- 自由提问 + 实时联想 -->
  <div class="ai-input-row">
    <div class="ai-input-wrap">
      <input type="text" class="ai-input" id="askInput" placeholder="例如：我现在适合换工作吗？" autocomplete="off">
      <div class="ai-suggest" id="aiSuggest"></div>
    </div>
    <button class="ai-send" onclick="doAskCustom()" title="发送"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </div>
  <div class="ai-body" id="askResult"></div>
</div>

<div class="modal" id="saveModal">
  <div class="modal-bg" onclick="closeSaveModal()"></div>
  <div class="modal-sheet glass" style="text-align:center">
    <div class="modal-close" onclick="closeSaveModal()">×</div>
    <div class="modal-title">保存命盘档案</div>
    <input type="text" id="saveName" style="width:100%;padding:12px 16px;border-radius:100px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-family:var(--sf);font-size:.9em;margin:12px 0;text-align:center" placeholder="输入档案名称…" maxlength="20" autocomplete="off">
    <button class="cta" style="padding:12px 32px;font-size:.9em" onclick="confirmSaveProfile()">保存</button>
  </div>
</div>

<div class="modal" id="rqModal">
  <div class="modal-bg" onclick="closeRq()"></div>
  <div class="modal-sheet glass">
    <div class="modal-close" onclick="closeRq()">×</div>
    <div class="modal-title">今日日签</div>
    <div id="rqResult" style="font-size:.85em;line-height:1.9;color:rgba(255,245,220,0.75);padding-top:8px"></div>
  </div>
</div>

<div class="tool-modal" id="toolModal" role="dialog" aria-modal="true" aria-label="工具详情">
  <div class="tool-modal-bg" onclick="closeToolPage()"></div>
  <div class="tool-sheet"><button class="tool-sheet-close" type="button" onclick="closeToolPage()">×</button><div id="toolModalContent"></div></div>
</div>

<div class="modal-month" id="monthModal">
  <div class="mm-bg" onclick="closeMonthModal()"></div>
  <div class="mm-sheet">
    <div class="modal-close" onclick="closeMonthModal()">×</div>
    <div id="monthModalContent"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
