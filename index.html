<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>问问大师 · 东方人生决策系统</title>

<meta name="theme-color" content="#faf9f5">
<meta name="description" content="问问大师 · 东方人生决策系统">

<script>
  /* 首屏前置写入主题，避免明暗闪烁 */
  (function () {
    try {
      var p = localStorage.getItem('tj_theme') || 'system';
      var m = (p === 'light' || p === 'dark') ? p
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', m);
      document.documentElement.style.colorScheme = m;
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="/src/theme-claude.css">
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/ig-dock.css">
<link rel="stylesheet" href="/src/claude-ui.css">
<link rel="stylesheet" href="/src/claude-refine.css">
</head>
<body>

<div class="mesh"></div>
<canvas class="particles" id="tjParticles"></canvas>
<div class="cursor-ring" id="tjCursorRing"></div>
<div class="cursor-dot" id="tjCursorDot"></div>

<div class="ld-ov" id="ldov">
  <div class="ld-sp"></div>
  <div class="ld-t">问问大师推演中</div>
  <div class="ld-br"><div class="ld-bf" id="ldbf"></div></div>
  <div class="ld-st" id="ldst">排列四柱…</div>
</div>

<div class="page" id="page1">
  <div class="p1-scroll">
    <div class="p1-inner">
      <!-- 今日一句：置于表单之前，回访用户一进来就能看到当天内容 -->
      <div id="todayCard" class="today-card" style="display:none"></div>

      <div class="home-card anim-in d1" id="formCard">
        <div class="form-grid">
          <div class="fd"><label>出生日期</label><input type="date" id="bDate" value="1990-06-15"></div>
          <div class="fd"><label>出生时间</label><input type="time" id="bTime" value="09:00" style="font-family:var(--sf)"></div>
          <div class="fd"><label>出生地点</label><div class="cw"><input type="text" id="cInp" placeholder="搜索城市…" autocomplete="off" value="上海"><input type="hidden" id="bPlace" value="shanghai"><div class="cdd" id="cDD"></div></div></div>
          <div class="fd"><label>性别</label><select id="bGen"><option value="male">男（乾造）</option><option value="female">女（坤造）</option></select></div>
          <div class="fd full">
            <label>你现在最想解决什么？</label>
            <div class="chip-wrap" id="qChips">
              <div class="chip" data-q="事业方向" onclick="selChip(this)">事业方向</div>
              <div class="chip" data-q="财运提升" onclick="selChip(this)">财运提升</div>
              <div class="chip" data-q="感情关系" onclick="selChip(this)">感情关系</div>
              <div class="chip" data-q="跳槽创业" onclick="selChip(this)">跳槽创业</div>
              <div class="chip" data-q="健康状态" onclick="selChip(this)">健康状态</div>
              <div class="chip" data-q="人生迷茫" onclick="selChip(this)">人生迷茫</div>
            </div>
            <input type="hidden" id="bQ" value="">
          </div>
        </div>
        <div class="switch-row" style="margin-top:6px"><div class="switch" id="swTrueSolar" onclick="this.classList.toggle('on');document.getElementById('swText').textContent=(this.classList.contains('on')?'开启':'关闭')+'真太阳时（按出生地经度精确换算时辰）'"></div><span id="swText">关闭真太阳时（按出生地经度精确换算时辰）</span></div>
        <div class="cta-row">
          <button class="cta" id="btnGo2" onclick="calc()">开始推演</button>
          <button class="preview-cta" type="button" onclick="calc(true)" aria-label="使用示例信息先查看报告">随便看看</button>
        </div>
      </div>
      <div id="recentZone" style="margin-bottom:24px;display:none">
        <div class="recent-hd">
          <div class="recent-hd-title">最近推演</div>
        </div>
        <div class="recent-grid" id="recentGrid"></div>
      </div>

      <div id="profileZone" style="margin-bottom:24px;display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:.78em;color:var(--c-text-3);letter-spacing:1px">命盘档案</div>
          <div style="display:flex;gap:8px">
            <button type="button" class="pf-io-btn" onclick="exportProfiles()">导出</button>
            <button type="button" class="pf-io-btn" onclick="document.getElementById('impFile').click()">导入</button>
            <input type="file" id="impFile" style="display:none" accept=".json" onchange="handleImport(this)">
          </div>
        </div>
        <div id="profileGrid" class="recent-grid"></div>
        <div id="profileEmpty" class="pf-empty" style="display:none;color:var(--c-text-4);font-size:.78em;text-align:center;padding:14px 0">暂无档案，推算后点击「保存」即可收藏命盘</div>
      </div>

      <div class="anim-in d2" style="text-align:center;padding:20px 0 8px">
        <p style="color:rgba(255,255,255,0.14);font-size:.6em;letter-spacing:4px">问 · 问 · 大 · 师 · 八 · 字 · 决 · 策</p>
      </div>
    </div>
  </div>
</div>

<div class="page hidden" id="page2">
  <div class="p2-top">
    <button class="p2-back" onclick="goBack()">
      <span>重新推演</span>
    </button>
    <div class="mode-top-group" role="tablist" aria-label="报告阅读模式"><button class="mode-top-switch" id="modeBeginner" type="button" role="tab" aria-selected="true" onclick="setUserMode('beginner')">新手</button><button class="mode-top-switch" id="modeMaster" type="button" role="tab" aria-selected="false" onclick="setUserMode('master')">大师</button></div>
    <div class="p2-actions"><button class="p2-act" type="button" onclick="openSaveModal()" title="保存档案" aria-label="保存档案"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
    </div>
  </div>
  <div class="p2-scroll" id="p2Scroll"><button class="back-to-top" id="backToTop" onclick="document.getElementById('p2Scroll').scrollTo({top:0,behavior:'smooth'})"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg></button>
    <div class="p2-inner" id="p2Inner"></div>
  </div>
</div>

<div class="ig-dock tab-bar" id="tabBar">
  <div class="tab-bar-inner">
    <div class="tab-indicator" id="tabIndicator"></div>
    <div class="tab-item active" data-sec="s-ming" onclick="switchTab(this)" aria-label="命盘"><svg class="ig-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.1"/><path d="M12 3.4v2.1M12 18.5v2.1M3.4 12h2.1M18.5 12h2.1M5.9 5.9l1.5 1.5m9.2 9.2 1.5 1.5m0-12.3-1.5 1.5m-9.2 9.2-1.5 1.5"/><path d="M9.6 12a2.4 2.4 0 1 0 4.8 0 2.4 2.4 0 1 1-4.8 0Z"/></svg><span class="ig-nav-label">命盘</span></div>
    <div class="tab-item" data-sec="s-yun" onclick="switchTab(this)" aria-label="运势"><svg class="ig-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.6c4.9.15 7.5-3.3 9-8.7"/><path d="M6.2 13.4c1.25-.05 2.2-.45 2.9-1.15M4.7 15.5h.9"/><path d="M14.2 4.1c.48 3.48 1.86 4.9 5.18 5.36-3.32.46-4.7 1.88-5.18 5.36-.48-3.48-1.86-4.9-5.18-5.36 3.32-.46 4.7-1.88 5.18-5.36Z"/></svg><span class="ig-nav-label">运势</span></div>
    <button class="ai-fab" id="aiFab" type="button" onclick="openAsk()" aria-label="打开问问大师" title="问问大师">
      <span class="ai-fab-icon"><svg class="ig-ai-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.7 3.2c.65 4.8 2.55 6.75 7.1 7.38-4.55.63-6.45 2.58-7.1 7.38-.65-4.8-2.55-6.75-7.1-7.38 4.55-.63 6.45-2.58 7.1-7.38Z"/><path d="M18.5 16.1c.22 1.6.85 2.25 2.36 2.46-1.51.21-2.14.86-2.36 2.46-.22-1.6-.85-2.25-2.36-2.46 1.51-.21 2.14-.86 2.36-2.46Z"/></svg></span><span class="ai-fab-text">问问</span><span class="ai-badge" aria-hidden="true">AI</span><span class="ai-beta-badge" aria-hidden="true">BETA</span>
    </button>
    <div class="tab-item" data-sec="s-rel" onclick="switchTab(this)" aria-label="关系"><svg class="ig-nav-icon ig-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 8.4c0 4.7-8.2 9.9-8.2 9.9S3.8 13.1 3.8 8.4A4.3 4.3 0 0 1 12 6.2a4.3 4.3 0 0 1 8.2 2.2Z"/></svg><span class="ig-nav-label">关系</span></div>
    <div class="tab-item" data-sec="s-adv" onclick="switchTab(this)" aria-label="工具"><svg class="ig-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.4" height="6.4" rx="1.4"/><rect x="13.6" y="4" width="6.4" height="6.4" rx="1.4"/><rect x="4" y="13.6" width="6.4" height="6.4" rx="1.4"/><rect x="13.6" y="13.6" width="6.4" height="6.4" rx="1.4"/></svg><span class="ig-nav-label">工具</span></div>
  </div>
</div>

<div class="lg-panel" id="lgPanel">
  <div class="lg-panel-tt">玻璃质感强度</div>
  <div class="lg-opts">
    <div class="lg-opt" data-mode="clear" onclick="setGlassMode('clear')">清澈</div>
    <div class="lg-opt active" data-mode="standard" onclick="setGlassMode('standard')">标准</div>
    <div class="lg-opt" data-mode="tinted" onclick="setGlassMode('tinted')">凝重</div>
  </div>
</div>

<div class="ai-overlay" id="aiOverlay" onclick="closeAsk()"></div>
<div class="ai-sheet" id="aiSheet">
  <div class="ai-actions">
    <button class="ai-new" type="button" onclick="newAskChat()" title="新对话" aria-label="新对话">＋</button>
    <button class="ai-settings" type="button" onclick="toggleAISettings()" title="AI 设置" aria-label="AI 设置"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
    <button class="ai-close" type="button" onclick="closeAsk()" title="关闭" aria-label="关闭">×</button>
  </div>
  <div class="ai-handle"></div>
  <div class="ai-head">
    <div class="ai-title">问问大师 <span class="ai-subtitle">命盘解读 · 行动建议</span></div>
    <div class="ai-context" id="aiContext"><span>✦ 智能定位</span><b>输入你的问题，获取结合命盘的具体建议</b></div>
    <div class="ai-free-prompt">可以问职业选择、关系困惑、近期计划，或任意命理术语。</div>
  </div>
  <!-- 自由提问 + 实时联想 -->
  <div class="ai-input-row">
    <div class="ai-input-wrap">
      <textarea class="ai-input" id="askInput" placeholder="例如：我现在适合换工作吗？" autocomplete="off" rows="1"></textarea>
      <div class="ai-suggest" id="aiSuggest"></div>
    </div>
    <button class="ai-send" onclick="doAskCustom()" title="发送"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </div>
  <div class="ai-body" id="askResult"></div>
</div>

<div class="modal" id="saveModal">
  <div class="modal-bg" onclick="closeSaveModal()"></div>
  <div class="modal-sheet glass" style="text-align:center">
    <div class="modal-close" onclick="closeSaveModal()">×</div>
    <div class="modal-title">保存命盘档案</div>
    <input type="text" id="saveName" style="width:100%;padding:12px 16px;border-radius:100px;border:1px solid var(--c-border-2);background:var(--c-surface-3);color:var(--c-text-hi);font-family:var(--sf);font-size:.9em;margin:12px 0;text-align:center" placeholder="输入档案名称…" maxlength="20" autocomplete="off">
    <button class="cta" style="padding:12px 32px;font-size:.9em" onclick="confirmSaveProfile()">保存</button>
  </div>
</div>

<div class="modal" id="rqModal">
  <div class="modal-bg" onclick="closeRq()"></div>
  <div class="modal-sheet glass">
    <div class="modal-close" onclick="closeRq()">×</div>
    <div class="modal-title">今日日签</div>
    <div id="rqResult" style="font-size:.85em;line-height:1.9;color:var(--c-text);padding-top:8px"></div>
  </div>
</div>

<div class="tool-modal" id="toolModal" role="dialog" aria-modal="true" aria-label="工具详情">
  <div class="tool-modal-bg" onclick="closeToolPage()"></div>
  <div class="tool-sheet">
    <button class="tool-sheet-close" type="button" onclick="closeToolPage()" aria-label="关闭" title="关闭">×</button>
    <div id="toolModalContent"></div>
  </div>
</div>

<div class="modal-month" id="monthModal">
  <div class="mm-bg" onclick="closeMonthModal()"></div>
  <div class="mm-sheet">
    <div class="modal-close" onclick="closeMonthModal()">×</div>
    <div id="monthModalContent"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
