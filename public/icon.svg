<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0d0804"/>
  
  <!-- 金色半环 — 从顶部出发，走右半边 -->
  <path d="M 256 68 C 420 68, 444 180, 444 256 C 444 370, 380 440, 256 440" fill="none" stroke="rgba(240,199,110,.55)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 橙红半环 — 从底部接续，走左半边，形成完整闭环 -->
  <path d="M 256 440 C 132 440, 68 370, 68 256 C 68 140, 124 68, 256 68" fill="none" stroke="#e8783a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 命运之眼 — 外圈 -->
  <circle cx="256" cy="256" r="36" fill="none" stroke="#fff" stroke-width="10" opacity=".35"/>
  
  <!-- 命运之眼 — 瞳孔 -->
  <circle cx="256" cy="256" r="14" fill="#f0c76e"/>
  
  <!-- 微弱光晕 -->
  <circle cx="256" cy="256" r="52" fill="none" stroke="#e8783a" stroke-width="3" opacity=".15"/>
</svg>
